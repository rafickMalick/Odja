name: CI

# Sur toute branche et toute proposition de fusion : une régression détectée
# après la fusion coûte dix fois plus cher qu'avant.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # Une nouvelle poussée annule la précédente sur la même branche : inutile de
  # payer deux fois pour un état déjà dépassé.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Les tests de bout en bout tournent contre un vrai PostgreSQL et un vrai
    # MinIO. Des doublures les rendraient verts sans rien prouver : les
    # invariants du grand livre sont tenus par des triggers, l'immuabilité par
    # une contrainte, et l'expiration des URL signées par le stockage.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oja
          POSTGRES_PASSWORD: oja_ci
          POSTGRES_DB: oja
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO n'est pas ici : Bitnami a retiré ses images du Docker Hub
      # (« manifest unknown » sur bitnami/minio:latest depuis fin 2025), et
      # l'image officielle quay.io/minio/minio a besoin d'une commande de
      # démarrage (`server /data`) qu'un service GitHub Actions ne peut pas
      # lui passer. Démarré à la main plus bas, en step Docker.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']

    env:
      DATABASE_URL: postgresql://oja:oja_ci@localhost:5432/oja?schema=public
      JWT_ACCESS_SECRET: secret-de-test-suffisamment-long
      JWT_REFRESH_SECRET: autre-secret-de-test-suffisamment-long
      ARGON2_PEPPER: poivre-de-test
      S3_ENDPOINT: http://localhost:9000
      # Identifiants par défaut de zenko/cloudserver (documentés, pas de notre
      # cru) : contrairement à S3Mock, il vérifie réellement la signature.
      S3_ACCESS_KEY: accessKey1
      S3_SECRET_KEY: verySecretKey1
      # Le service ajoute lui-même les suffixes « -public » et « -private ».
      S3_BUCKET: oja-ci
      S3_PUBLIC_BASE_URL: http://localhost:9000/oja-ci-public
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      REQUIRE_PHONE_VERIFICATION: 'false'
      SCHEDULER_ENABLED: 'false'
      RATE_LIMIT_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      # quay.io/minio/minio (essayé ensuite) répond aussi « unauthorized », et
      # même les binaires officiels sur dl.min.io renvoient 410 Gone : MinIO a
      # verrouillé toute sa distribution gratuite en 2025, pas seulement ses
      # images Docker Hub. adobe/s3mock (essayé après) démarre bien, mais
      # n'impose aucune vraie vérification de signature ni d'ACL — un fichier
      # du compartiment privé restait lisible sans authentification, ce que
      # « rend le fichier privé illisible sans signature » (upload.e2e.test.ts)
      # est censé garantir. zenko/cloudserver applique de vraies ACL S3
      # (private par défaut, public-read explicite) et vérifie la signature
      # SigV4 — la seule des quatre options qui prouve encore quelque chose.
      - name: Démarrer CloudServer (compatible S3, remplace MinIO)
        run: |
          docker run -d --name cloudserver -p 9000:8000 zenko/cloudserver:latest

          echo "Attente que CloudServer réponde…"
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:9000/; then
              echo "CloudServer prêt."
              exit 0
            fi
            sleep 1
          done
          echo "::error::CloudServer n'a jamais répondu."
          exit 1

      # Les deux compartiments que StorageService dérive de S3_BUCKET.
      # oja-ci-public est explicitement rendu public (ACL canonique
      # public-read) ; oja-ci-private garde l'ACL private par défaut, que
      # CloudServer applique réellement — contrairement à S3Mock.
      - name: Créer les compartiments S3
        env:
          AWS_ACCESS_KEY_ID: accessKey1
          AWS_SECRET_ACCESS_KEY: verySecretKey1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket oja-ci-public --acl public-read
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket oja-ci-private

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Générer le client Prisma
        run: npm run db:generate

      # Contrôle mécanique : Prisma régénère un `DROP INDEX products_search_idx`
      # dans chaque migration touchant `products`. C'est arrivé quatre fois.
      - name: Vérifier les migrations
        run: node packages/db/scripts/check-migrations.mjs

      - name: Appliquer les migrations
        run: npm run db:migrate:deploy

      - name: Peupler les données de référence
        run: npm run db:seed

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Une image qui ne se construit pas se découvre au déploiement, un vendredi
  # soir. On la construit ici, sans la pousser.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Image de l'API
        run: docker build -f apps/api/Dockerfile -t oja-api:ci .

      - name: Image du front
        run: docker build -f apps/web/Dockerfile -t oja-web:ci .

services:
  - type: web
    name: oja-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # "development", pas "production" : les clés Kadev Pay sont des clés de
      # test (kdvs_test_...), et env.ts refuse justement de démarrer avec une
      # clé de test sous NODE_ENV=production (cahier § 7.7). Ce déploiement
      # est une recette, pas la mise en production réelle.
      - key: NODE_ENV
        value: development
      # Pas d'API_PORT ici : le Dockerfile déclare EXPOSE 4000 et son propre
      # HEALTHCHECK interroge 127.0.0.1:4000 — changer le port sans changer
      # les deux ferait échouer l'un des deux silencieusement.
      - key: DATABASE_URL
        sync: false
      # Connexion DIRECTE Neon (sans « -pooler » dans l'hôte), utilisée par
      # les migrations au démarrage (apps/api/docker-entrypoint.sh). Facultatif
      # si DATABASE_URL est déjà une connexion directe.
      - key: DIRECT_DATABASE_URL
        sync: false
      # Adresse du premier administrateur : le compte qui s'inscrit (ou qui
      # existe déjà) avec cet e-mail devient ADMIN, tant qu'aucun admin
      # n'existe. Sans effet ensuite. Voir AdminBootstrapService.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Relais devant l'API : Vercel (le site relaie /api/v1) puis Render.
      # Sans lui, tous les visiteurs ont la même adresse vue par l'API, et la
      # limitation de débit les bloque ensemble.
      - key: TRUST_PROXY_HOPS
        value: 2
      # oja.aworix.agency une fois le domaine branché (DEPLOIEMENT.md § 5 bis).
      # Vide tant que l'API reste sur onrender.com.
      - key: COOKIE_DOMAIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ARGON2_PEPPER
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: kadevpay
      - key: KADEVPAY_PUBLIC_KEY
        sync: false
      - key: KADEVPAY_SECRET_KEY
        sync: false
      - key: KADEVPAY_WEBHOOK_SECRET
        sync: false
      - key: KADEVPAY_MODE
        value: test
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SCHEDULER_ENABLED
        value: true
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: REQUIRE_PHONE_VERIFICATION
        value: false
